name: Build Android APK

on:
  workflow_dispatch:        # 允许在 GitHub 网页上手动触发
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # GitHub runner 已预装 Android SDK（含 cmdline-tools），直接用其 sdkmanager，
      # 不再使用 android-actions/setup-android（其新版会安装已废弃的 tools 包而报错）
      - name: Accept Android SDK licenses
        run: 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true'

      - name: Install SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"'

      # 仓库里不提交 gradle-wrapper.jar，构建时用 runner 自带的 gradle 现生成 wrapper，
      # 这样 Gradle 版本固定（AGP 8.2.2 需要 Gradle 8.x），也便于缓存依赖。
      # 初版使用的 gradle/gradle-build-action 已归档，这里换成官方 gradle/actions。
      - name: Generate Gradle wrapper
        working-directory: android_app
        run: |
          if command -v gradle >/dev/null 2>&1; then
            gradle wrapper --gradle-version 8.5 --distribution-type bin
          else
            echo "::error::gradle not found on runner"
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android_app

      - name: Build debug APK
        working-directory: android_app
        run: './gradlew --no-daemon assembleDebug'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
