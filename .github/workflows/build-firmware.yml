name: Build ESP8266 Firmware

on:
  workflow_dispatch:        # 允许在 GitHub 网页手动触发
  push:
    branches: [ main, master ]
    paths:
      - 'esp8266_controller/**'
      - '.github/workflows/build-firmware.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO and esptool
        run: 'python -m pip install --upgrade pip && pip install platformio esptool'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('esp8266_controller/platformio.ini') }}

      - name: Build firmware
        run: 'cd esp8266_controller && pio run'

      # ESP8266 不像 ESP32 那样有分区表（没有 bootloader.bin / partitions.bin），
      # PlatformIO 只产出一个 firmware.bin，烧录地址固定为 0x0。
      # 直接把它当作产物上传即可（初版按 ESP32 拼接镜像会导致 merge_bin 找不到文件而失败）。
      - name: Collect firmware binary
        run: |
          mkdir -p dist
          cp esp8266_controller/.pio/build/generic_esp8266/firmware.bin dist/esp8266-io-controller-0x00000.bin
          cp esp8266_controller/.pio/build/generic_esp8266/firmware.elf dist/firmware.elf || true
          ls -lh dist

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp8266-firmware
          path: dist/
