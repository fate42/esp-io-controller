; PlatformIO 工程配置（可选，Arduino IDE 用户可忽略）
; 安装：pip install platformio，然后 pio run -t upload
[platformio]
; 国内加速镜像（解决跨境 CDN 下载工具链中断的问题；本机网络正常时也可删掉这行）
default_mirrors = https://mirrors.tuna.tsinghua.edu.cn/platformio/

[env:generic_esp8266]
platform = espressif8266
board = esp12e
framework = arduino
lib_deps =
    knolleary/PubSubClient @ ^2.8
monitor_speed = 115200
upload_speed = 115200
